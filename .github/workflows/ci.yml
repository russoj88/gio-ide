# Linux CI. A push to main also publishes the .deb.
name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev \
            libffi-dev libxcursor-dev libvulkan-dev \
            jq python3

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0

      - name: Format
        run: |
          set -euo pipefail
          files="$(gofumpt -l .)"
          bad=()
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            case "${f}" in
              internal/gopls|internal/gopls/*|internal/thirdparty|internal/thirdparty/*) continue ;;
            esac
            bad+=("${f}")
          done <<< "${files}"
          if [ "${#bad[@]}" -gt 0 ]; then
            printf '%s\n' "${bad[@]}"
            gofumpt -d "${bad[@]}"
            exit 1
          fi

      - name: Tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: |
          set -euo pipefail
          list="$(go list ./...)"
          pkgs=()
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            case "${p}" in
              */internal/gopls|*/internal/gopls/*|*/internal/thirdparty|*/internal/thirdparty/*) continue ;;
            esac
            pkgs+=("${p}")
          done <<< "${list}"
          go test -race "${pkgs[@]}"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One standing release until the project uses real versions.
          # dpkg requires a leading digit, so the package version has no "v".
          tag="v0.0.0"
          ver="0.0.0"
          ./cmd/package-debian.sh "${ver}" dist
          assets=(dist/*.deb dist/*_linux_* dist/SHA256SUMS)
          notes="Debian package and Linux binary for ${GITHUB_SHA}."
          # Replace the release so the tag points at this commit.
          gh release delete "${tag}" --yes --cleanup-tag || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" || true
          gh release create "${tag}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "${tag}" \
            --notes "${notes}"
